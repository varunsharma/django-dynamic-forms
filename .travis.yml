language: python

python: 3.5

cache:
  directories:
    - .ci-replay-cache

stages:
  - name: replay-01
  - name: replay-02
  - name: replay-03
  - name: replay-04
  - name: replay-05
  - name: replay-06
  - name: replay-07
  - name: replay-08
  - name: replay-09
  - name: replay-10
  - name: replay-11
  - name: replay-12
  - name: replay-13
  - name: replay-14
  - name: replay-15
  - name: replay-16
  - name: replay-17
  - name: replay-18
jobs:
  include:
    - stage: replay-01
      env: TOXENV=py27-dj17
    - stage: replay-02
      env: TOXENV=py33-dj17
    - stage: replay-03
      env: TOXENV=py34-dj17
    - stage: replay-04
      env: TOXENV=py33-dj18
    - stage: replay-05
      env: TOXENV=py27-dj18
    - stage: replay-06
      env: TOXENV=py27-dj19
    - stage: replay-07
      env: TOXENV=py27-dj110
    - stage: replay-08
      env: TOXENV=py34-dj18
    - stage: replay-09
      env: TOXENV=py34-dj19
    - stage: replay-10
      env: TOXENV=py34-dj110
    - stage: replay-11
      env: TOXENV=py35-dj18
    - stage: replay-12
      env: TOXENV=py35-dj19
    - stage: replay-13
      env: TOXENV=py35-dj110
    - stage: replay-14
      env: TOXENV=py27-djmaster
    - stage: replay-15
      env: TOXENV=py34-djmaster
    - stage: replay-16
      env: TOXENV=py35-djmaster
    - stage: replay-17
      env: TOXENV=flake8
    - stage: replay-18
      env: TOXENV=isort

install:
  - pip install -U pip
  - pip install -U tox
  - pip install codecov

script:
  - tox -e ${TOXENV}

after_success:
  - codecov
